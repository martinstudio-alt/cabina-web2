<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cabina</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000000;

      overflow: hidden;

      font-family: Arial, sans-serif;

    }

    #pantalla {

      width: 100%;
      height: 100%;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

    }

    #logo {

      width: 300px;

      max-width: 70vw;

      height: auto;

      margin-bottom: 40px;

    }

    #mensaje {

      color: #FFFFFF;

      font-size: 24px;

    }

  </style>

</head>

<body>

  <div id="pantalla">

    <img
      id="logo"
      src="logo.png"
      alt="Cabina"
    >

    <div id="mensaje">
      Esperando nueva experiencia...
    </div>

  </div>

</body>

</html>
